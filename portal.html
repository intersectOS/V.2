<!DOCTYPE html>
<html lang="en" id="ph">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intersect PartnerOS · Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{--void:#030407;--card:#0f1220;--card2:#141728;--border:#1a1f38;--ink:#e8ecf8;--ink2:#8892b0;--ink3:#4a5270;--teal:#06b6d4;--green:#22c55e;--red:#ef4444;--purple:#7c3aed;--gold:#f59e0b;--grad:linear-gradient(135deg,#7c3aed,#3b82f6);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--void);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
[lang=ar]{font-family:'Cairo',sans-serif!important;direction:rtl;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 30px;width:420px;max-width:100%;}
.logo{text-align:center;margin-bottom:24px;}
.logo-icon{width:56px;height:56px;background:var(--grad);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 auto 12px;}
.logo-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;}
.logo-sub{font-size:12px;color:var(--ink3);margin-top:3px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.role-btn{background:var(--card2);border:2px solid var(--border);border-radius:11px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;}
.role-btn:hover{border-color:var(--teal);background:rgba(6,182,212,.05);}
.role-btn.on{border-color:var(--teal);background:rgba(6,182,212,.08);}
.role-icon{font-size:24px;margin-bottom:6px;}
.role-name{font-size:12px;font-weight:600;color:var(--ink2);}
.role-btn.on .role-name{color:var(--teal);}
.fi{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:12px;}
.fi:focus{outline:none;border-color:var(--teal);}
.lbtn{width:100%;background:var(--grad);border:none;border-radius:10px;padding:13px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.lbtn:hover{opacity:.9;}
.err{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}
.lang-bar{position:fixed;top:12px;right:12px;display:flex;gap:4px;flex-wrap:wrap;max-width:180px;justify-content:flex-end;}
.lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:3px 7px;color:#e8ecf8;font-size:10px;cursor:pointer;font-family:inherit;}
.spin{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lb" onclick="setL('en')">EN</button>
  <button class="lb" onclick="setL('ar')">AR</button>
  <button class="lb" onclick="setL('es')">ES</button>
  <button class="lb" onclick="setL('fr')">FR</button>
  <button class="lb" onclick="setL('ja')">JA</button>
  <button class="lb" onclick="setL('zh')">ZH</button>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">IX</div>
    <div class="logo-name">INTERSECT</div>
    <div class="logo-sub">PartnerOS · Secure Access</div>
  </div>

  <div class="role-grid">
    <div class="role-btn on" onclick="selectRole('client',this)">
      <div class="role-icon">🏢</div>
      <div class="role-name">Client</div>
    </div>
    <div class="role-btn" onclick="selectRole('partner',this)">
      <div class="role-icon">🤝</div>
      <div class="role-name">Success Partner</div>
    </div>
    <div class="role-btn" onclick="selectRole('strategic',this)">
      <div class="role-icon">⚙️</div>
      <div class="role-name">Strategic Partner</div>
    </div>
    <div class="role-btn" onclick="selectRole('jv',this)">
      <div class="role-icon">🏦</div>
      <div class="role-name">JV Partner</div>
    </div>
    <div class="role-btn" onclick="selectRole('team',this)">
      <div class="role-icon">👥</div>
      <div class="role-name">Team / Consultant</div>
    </div>
    <div class="role-btn" onclick="selectRole('expert',this)">
      <div class="role-icon">🌟</div>
      <div class="role-name">Expert</div>
    </div>
    <div class="role-btn" onclick="selectRole('coordinator',this)">
      <div class="role-icon">📋</div>
      <div class="role-name">Coordinator</div>
    </div>
  </div>

  <input class="fi" id="username" placeholder="Username" autocomplete="username">
  <input class="fi" id="password" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="lbtn" onclick="doLogin()">
    <span id="btn-text">Sign In →</span>
    <div class="spin" id="spin"></div>
  </button>
  <div class="err" id="err">Invalid username or password</div>
</div>

<script>
var SB_URL='https://rppwppxyhmuicgemmecu.supabase.co';
var SB_KEY='sb_publishable_ELJltVdYvF4juilMVf3Ecw_CrSYmjuz';
var sb=null;
var selectedRole='client';

try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}

function setL(l){
  var h=document.getElementById('ph');
  h.setAttribute('lang',l);
  h.setAttribute('dir',l==='ar'?'rtl':'ltr');
  try{localStorage.setItem('ix_lang',l);}catch(e){}
}
function initLang(){var l;try{l=localStorage.getItem('ix_lang')||'en';}catch(e){l='en';}setL(l);}

function selectRole(role,el){
  selectedRole=role;
  document.querySelectorAll('.role-btn').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  var ph={'client':'Client username','team':'Your name / code','expert':'Your name / code','coordinator':'Coordinator name'};
  document.getElementById('username').placeholder=ph[role]||'Username';
}

async function doLogin(){
  var user=document.getElementById('username').value.trim();
  var pass=document.getElementById('password').value.trim();
  var errEl=document.getElementById('err');
  errEl.style.display='none';
  if(!user||!pass){errEl.textContent='Please enter username and password';errEl.style.display='block';return;}

  document.getElementById('btn-text').style.display='none';
  document.getElementById('spin').style.display='block';

  try{
    if(selectedRole==='coordinator'){
      var storedPass=localStorage.getItem('ix_coord_pass')||'coordinator2026';
      var storedName=localStorage.getItem('ix_coord_name')||'coordinator';
      if(pass===storedPass&&(user.toLowerCase()===storedName.toLowerCase()||user.toLowerCase()==='coordinator')){
        window.location.href='transcript.html';
        return;
      }
      showErr('Invalid coordinator credentials');
      return;
    }

    if(selectedRole==='client'||selectedRole==='partner'||selectedRole==='strategic'){
      var r=await sb.from('ix_clients_v2').select('*').eq('username',user).limit(1);
      if(r.data&&r.data.length>0&&r.data[0].portal_password===pass){
        var rec=r.data[0];
        localStorage.setItem('ix_portal_type',rec.client_type||'client');
        localStorage.setItem('ix_portal_id',rec.id);
        localStorage.setItem('ix_portal_data',JSON.stringify(rec));
        window.location.href='client.html';
        return;
      }
      // Fallback: try by code
      var r2=await sb.from('ix_clients_v2').select('*').eq('code',user).limit(1);
      if(r2.data&&r2.data.length>0&&(r2.data[0].portal_password===pass||pass===r2.data[0].code)){
        var rec2=r2.data[0];
        localStorage.setItem('ix_portal_type',rec2.client_type||'client');
        localStorage.setItem('ix_portal_id',rec2.id);
        localStorage.setItem('ix_portal_data',JSON.stringify(rec2));
        window.location.href='client.html';
        return;
      }
      showErr('Invalid credentials');
      return;
    }

    if(selectedRole==='team'||selectedRole==='expert'){
      var r=await sb.from('ix_people').select('*').eq('username',user).limit(1);
      if(r.data&&r.data.length>0&&r.data[0].portal_password===pass){
        var person=r.data[0];
        localStorage.setItem('ix_portal_type',person.person_type);
        localStorage.setItem('ix_portal_id',person.id);
        localStorage.setItem('ix_portal_data',JSON.stringify(person));
        var page='team.html';
        window.location.href=page;
        return;
      }
      // Fallback: try by access_code
      var r2=await sb.from('ix_people').select('*').eq('access_code',user).limit(1);
      if(r2.data&&r2.data.length>0&&(r2.data[0].portal_password===pass||pass===r2.data[0].access_code)){
        var person=r2.data[0];
        localStorage.setItem('ix_portal_type',person.person_type);
        localStorage.setItem('ix_portal_id',person.id);
        localStorage.setItem('ix_portal_data',JSON.stringify(person));
        var page='team.html';
        window.location.href=page;
        return;
      }
      showErr('Invalid credentials');
      return;
    }

  }catch(e){
    console.error(e);
    showErr('Connection error. Try again.');
  }
}

function showErr(msg){
  document.getElementById('btn-text').style.display='block';
  document.getElementById('spin').style.display='none';
  var errEl=document.getElementById('err');
  errEl.textContent=msg;
  errEl.style.display='block';
}

window.addEventListener('DOMContentLoaded',function(){initLang();});
</script>
</body>
</html>
