// ── VOICE SYSTEM ──
var _voiceLang = 'en';
var _voiceEnabled = true;
var _voiceLangMap = {
  'en': 'en-US', 'ar': 'ar-SA', 'es': 'es-ES',
  'fr': 'fr-FR', 'ja': 'ja-JP', 'zh': 'zh-CN', 'pt': 'pt-BR'
};
var _voiceGreeted = false;

function speak(text, lang) {
  if (!_voiceEnabled) return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = _voiceLangMap[lang || _voiceLang] || 'en-US';
  u.rate = 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;
  // Try to find a matching voice
  var voices = window.speechSynthesis.getVoices();
  var match = voices.find(function(v) { return v.lang.startsWith(u.lang.split('-')[0]); });
  if (match) u.voice = match;
  window.speechSynthesis.speak(u);
}

function voiceGreet(name, pendingCount, lang) {
  if (_voiceGreeted) return;
  _voiceGreeted = true;
  _voiceLang = lang || _voiceLang;
  var msgs = {
    'en': 'Welcome back, ' + name + '. You have ' + pendingCount + ' pending items.',
    'ar': 'مرحباً ' + name + '. لديك ' + pendingCount + ' طلبات معلقة.',
    'es': 'Bienvenido, ' + name + '. Tienes ' + pendingCount + ' elementos pendientes.',
    'fr': 'Bienvenue, ' + name + '. Vous avez ' + pendingCount + ' éléments en attente.',
    'ja': 'おかえりなさい、' + name + 'さん。' + pendingCount + '件の保留中のアイテムがあります。',
    'zh': '欢迎回来，' + name + '。您有 ' + pendingCount + ' 个待处理项目。',
    'pt': 'Bem-vindo, ' + name + '. Você tem ' + pendingCount + ' itens pendentes.'
  };
  var msg = msgs[_voiceLang] || msgs['en'];
  setTimeout(function() { speak(msg, _voiceLang); }, 800);
}

function voiceNotify(type, detail, lang) {
  if (!_voiceEnabled) return;
  var l = lang || _voiceLang;
  var msgs = {
    new_request: {
      'en': 'New request: ' + detail,
      'ar': 'طلب جديد: ' + detail,
      'es': 'Nueva solicitud: ' + detail,
      'fr': 'Nouvelle demande: ' + detail,
      'ja': '新しいリクエスト: ' + detail,
      'zh': '新请求: ' + detail,
      'pt': 'Nova solicitação: ' + detail
    },
    new_ticket: {
      'en': 'New ticket from ' + detail,
      'ar': 'تذكرة جديدة من ' + detail,
      'es': 'Nuevo ticket de ' + detail,
      'fr': 'Nouveau ticket de ' + detail,
      'ja': detail + 'からの新しいチケット',
      'zh': '来自 ' + detail + ' 的新工单',
      'pt': 'Novo ticket de ' + detail
    },
    new_meeting: {
      'en': 'Meeting scheduled: ' + detail,
      'ar': 'اجتماع جديد: ' + detail,
      'es': 'Reunión programada: ' + detail,
      'fr': 'Réunion planifiée: ' + detail,
      'ja': '会議が予定されました: ' + detail,
      'zh': '会议已安排: ' + detail,
      'pt': 'Reunião agendada: ' + detail
    },
    new_client: {
      'en': 'New client added: ' + detail,
      'ar': 'عميل جديد: ' + detail,
      'es': 'Nuevo cliente: ' + detail,
      'fr': 'Nouveau client: ' + detail,
      'ja': '新しいクライアント: ' + detail,
      'zh': '新客户: ' + detail,
      'pt': 'Novo cliente: ' + detail
    }
  };
  var t = msgs[type];
  if (t) speak(t[l] || t['en'], l);
}

// Toggle voice on/off
function toggleVoice() {
  _voiceEnabled = !_voiceEnabled;
  var btn = document.getElementById('voice-toggle-btn');
  if (btn) btn.textContent = _voiceEnabled ? '🔊' : '🔇';
  if (!_voiceEnabled) window.speechSynthesis && window.speechSynthesis.cancel();
  try { localStorage.setItem('ix_voice', _voiceEnabled ? '1' : '0'); } catch(e) {}
}

// Load voice preference
try {
  var vp = localStorage.getItem('ix_voice');
  if (vp === '0') _voiceEnabled = false;
} catch(e) {}

// Load voices async (Chrome requires this)
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = function() {
    window.speechSynthesis.getVoices();
  };
}

<script>
var SB_URL='https://zmiywdpfdvllsxalklrv.supabase.co';var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptaXl3ZHBmZHZsbHN4YWxrbHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTc4NDYsImV4cCI6MjA5NDU5Mzg0Nn0.l9DYJ8DeBGXmxNC4qYjKvuVzSlLDWLr7FERQEMY2kAs';var TG_TOKEN='8985981672:AAEeDXMaUgi57AHYr_t3A9AoZZp5iey28g0';var TG_MGMT='851323429';
var sb=null;var partnerData=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}
function showError(){document.getElementById('loading').style.display='none';document.getElementById('error-sc').style.display='flex';}
function doLogout(){try{localStorage.removeItem('ix_portal_data');sessionStorage.removeItem('ix_portal_data');}catch(e){}window.location.href='portal.html';}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='ts'?'rgba(34,197,94,.9)':type==='te'?'rgba(239,68,68,.9)':'rgba(124,58,237,.9)';t.style.color='#fff';t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},3000);}
function showTab(n,el){
  if(n==='meeting-invites')loadMeetingInvites();document.querySelectorAll('.tp').forEach(function(p){p.classList.remove('on');});document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});var tp=document.getElementById('tp-'+n);if(tp)tp.classList.add('on');if(el)el.classList.add('on');if(n==='stp-assignments')loadAssignments();if(n==='stp-requests')loadRequests();if(n==='stp-news')loadNews();}
function sendTG(msg){fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_MGMT,text:msg,parse_mode:'Markdown'})}).catch(function(){});}
document.addEventListener('DOMContentLoaded',function(){var stored=null;try{stored=localStorage.getItem('ix_portal_data');}catch(e){}if(!stored){try{stored=sessionStorage.getItem('ix_portal_data');}catch(e){}}if(!stored){return showError();}try{partnerData=JSON.parse(stored);if(!partnerData||!partnerData.name)return showError();render();}catch(e){showError();}});
function render(){
  document.getElementById('loading').style.display='none';document.getElementById('main').style.display='block';

async function loadAssignments(){
  var el=document.getElementById('stp-assignments-list');if(!el)return;
  try{
    var r=await sbFetch('ix_partner_projects','partner_id=eq.partnerData.id',{order:"created_at.desc"});
    var items=r.data||[];
    if(!items.length){el.innerHTML='<div style="text-align:center;color:var(--ink3);padding:20px;">No assignments yet</div>';return;}
    var sel=document.getElementById('stp-upd-proj');
    if(sel)sel.innerHTML='<option value="">— Select —</option>'+items.map(function(a){return '<option value="'+a.id+'">'+a.title+(a.client_name?' ('+a.client_name+')':'')+'</option>';}).join('');
    var sc={Active:'pg',Completed:'pgr','On Hold':'pgo'};
    el.innerHTML=items.map(function(a){
      return '<div style="background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:7px;">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><div style="font-size:13px;font-weight:700;">'+a.title+'</div><span class="pill '+(sc[a.status]||'pgr')+'">'+a.status+'</span></div>'
        +(a.client_name?'<div style="font-size:11px;color:var(--gold);">📁 '+a.client_name+'</div>':'')
        +(a.notes?'<div style="font-size:12px;color:var(--ink2);margin-top:5px;">'+a.notes.slice(0,100)+'</div>':'')
      +'</div>';
    }).join('');
  }catch(e){el.innerHTML='<div style="color:var(--red);padding:16px;">Error</div>';}
}
async function submitUpdate(){
  var text=document.getElementById('stp-upd-text').value.trim();
  if(!text){toast('Write your update','te');return;}
  var projSel=document.getElementById('stp-upd-proj').value;
  try{
    await sbInsert('ix_requests',{title:'[Strategic Update] '+partnerData.name,description:text,requested_by:partnerData.name,context_type:'strategic_update',context_value:projSel||null,status:'Pending',priority:'medium',show_to_client:false});
    document.getElementById('stp-upd-text').value='';
    var s=document.getElementById('stp-upd-sent');if(s){s.style.display='block';setTimeout(function(){s.style.display='none';},3000);}
    sendTG('🔄 *Strategic Update*\n\nFrom: '+partnerData.name+'\n\n'+text.slice(0,100));
    toast('✅ Update submitted!','ts');
  }catch(e){toast('Error','te');}
}
async function loadRequests(){
  var el=document.getElementById('stp-reqs-list');if(!el)return;
  try{
    var r=await sbFetch('ix_requests','requested_by=eq.partnerData.name',{order:"created_at.desc"});
    var items=r.data||[];
    if(!items.length){el.innerHTML='<div style="text-align:center;color:var(--ink3);padding:16px;">No requests</div>';return;}
    var sc={Pending:'pgo',Accepted:'pg',Rejected:'pr',Completed:'pgr'};
    el.innerHTML=items.map(function(r){return '<div style="background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:7px;"><div style="display:flex;justify-content:space-between;"><div style="font-size:12px;font-weight:600;">'+r.title.slice(0,50)+'</div><span class="pill '+(sc[r.status]||'pgr')+'">'+r.status+'</span></div>'+(r.reply?'<div style="font-size:11px;color:var(--teal);margin-top:4px;">💬 '+r.reply.slice(0,80)+'</div>':'')+'<div style="font-size:10px;color:var(--ink3);margin-top:4px;">'+new Date(r.created_at).toLocaleDateString()+'</div></div>';}).join('');
  }catch(e){}
}
async function loadNews(){
  var el=document.getElementById('stp-news-list');if(!el)return;
  try{var r=await sbFetch('ix_news','',{order:"created_at.desc",limit:20});var items=r.data||[];if(!items.length){el.innerHTML='<div style="text-align:center;color:var(--ink3);padding:20px;">No news</div>';return;}el.innerHTML=items.map(function(n){return '<div style="background:var(--card2);border:1px solid var(--border);border-left:3px solid #a78bfa;border-radius:9px;padding:12px;margin-bottom:8px;"><div style="font-size:13px;font-weight:700;margin-bottom:5px;">'+n.title+'</div><div style="font-size:12px;color:var(--ink2);line-height:1.6;">'+n.content+'</div>'+(n.link?'<a href="'+n.link+'" target="_blank" style="font-size:11px;color:var(--teal);">→ Read more</a>':'')+'<div style="font-size:10px;color:var(--ink3);margin-top:5px;">'+new Date(n.created_at).toLocaleDateString()+'</div></div>';}).join('');}catch(e){}
}
</script>
</body></html>
