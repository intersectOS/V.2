<!DOCTYPE html>
<html lang="en" id="trh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intersect · Meeting Coordinator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#030407;--card:#0f1220;--card2:#141728;--border:#1a1f38;--ink:#e8ecf8;--ink2:#8892b0;--ink3:#4a5270;--teal:#06b6d4;--green:#22c55e;--red:#ef4444;--purple:#7c3aed;--gold:#f59e0b;--grad:linear-gradient(135deg,#06b6d4,#7c3aed);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--void);color:var(--ink);min-height:100vh;}
[lang=ar]{font-family:'Cairo',sans-serif!important;direction:rtl;}
#login-sc{position:fixed;inset:0;background:var(--void);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;}
#main{display:none;}
.lcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px 28px;width:380px;max-width:100%;text-align:center;}
.ltit{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
.lsub{font-size:13px;color:var(--ink3);margin-bottom:22px;}
.fi{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:12px;}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--teal);}
.lbtn{width:100%;background:var(--grad);border:none;border-radius:9px;padding:12px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.header{background:linear-gradient(180deg,rgba(6,182,212,.06),transparent);border-bottom:1px solid var(--border);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;}
.htit{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}
.hbtns{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:none;}
.bbg{background:var(--grad);color:#fff;}.bbo{background:transparent;border:1px solid var(--border);color:var(--ink2);}.br{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px);}
.sidebar{border-right:1px solid var(--border);padding:16px;overflow-y:auto;}
.lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:3px 7px;color:#e8ecf8;font-size:10px;cursor:pointer;font-family:inherit;}
.lb.on{background:rgba(6,182,212,.2);border-color:#06b6d4;color:var(--teal);}
@media(max-width:768px){
  .layout{grid-template-columns:1fr!important;}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:200px;overflow-y:auto;}
  .hbtns{flex-wrap:wrap;gap:4px;}
  .hbtns .btn{font-size:10px;padding:5px 7px;}
  .content{padding:10px;}
  .mo{padding:0;align-items:flex-end;}
  .modal{width:100%;border-radius:16px 16px 0 0;max-height:90vh;padding:18px 14px;margin:0;}
  .mft{flex-direction:column;gap:8px;}
  .mft .btn{width:100%;padding:12px!important;}
  .fi2,.fs,.fta{font-size:16px!important;}
  input[type=date]{font-size:16px!important;}
  .header{padding:12px 14px;flex-wrap:wrap;gap:8px;}
  .htit{font-size:15px;}
}
@media(max-width:480px){
  .hbtns .btn{font-size:9px;padding:4px 6px;}
  .sidebar{max-height:160px;}
  .cl-item{padding:8px 10px;}
  .cl-name{font-size:12px;}
}
.sb-title{font-size:10px;letter-spacing:2px;color:var(--ink3);text-transform:uppercase;font-weight:700;margin-bottom:10px;padding:0 4px;}
.cl-item{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .15s;}
.cl-item:hover{background:var(--card2);border-color:var(--border);}
.cl-item.on{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.2);}
.cl-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.cl-meta{font-size:11px;color:var(--ink3);}
.cl-badge{display:inline-flex;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(6,182,212,.1);color:var(--teal);margin-top:4px;}
.new-cl-btn{width:100%;background:rgba(34,197,94,.06);border:1px dashed rgba(34,197,94,.3);border-radius:9px;padding:10px;color:#22c55e;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-top:8px;}
.content{padding:20px;overflow-y:auto;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:14px;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--border);}
.pt{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;}
.pb{padding:14px;}
.fg{margin-bottom:11px;}
.fl{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:4px;display:block;}
.fs,.fta{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:13px;}
.fs option{background:var(--card2);}
.fta{resize:vertical;min-height:80px;line-height:1.6;}
.fi2{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:13px;}
.fi2:focus{outline:none;border-color:var(--teal);}
.meet-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:9px;}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:600;z-index:9999;transition:all .3s;opacity:0;transform:translateY(7px);pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.ts{border-color:rgba(34,197,94,.3);color:#22c55e;}.te{border-color:rgba(239,68,68,.3);color:var(--red);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;padding:14px;}
.modal{background:var(--card);border:1px solid #232a45;border-radius:14px;padding:20px;width:500px;max-width:100%;max-height:90vh;overflow-y:auto;}
.mti{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;}
.mft{display:flex;gap:7px;justify-content:flex-end;margin-top:13px;padding-top:12px;border-top:1px solid var(--border);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:3px 7px;color:#e8ecf8;font-size:10px;cursor:pointer;font-family:inherit;}
.lb.on{background:rgba(6,182,212,.2);border-color:#06b6d4;color:var(--teal);}
@media(max-width:768px){.layout{grid-template-columns:1fr;}.sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:200px;}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="login-sc">
  <div class="lcard">
    <div style="font-size:40px;margin-bottom:12px;">📋</div>
    <div class="ltit">Meeting Coordinator</div>
    <div class="lsub">Intersect PartnerOS · Founders Only</div>
    <input type="password" class="fi" id="coord-pass" placeholder="Enter coordinator password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="lbtn" onclick="doLogin()">ACCESS PORTAL</button>
    <div id="lerr" style="color:var(--red);font-size:12px;margin-top:10px;display:none;">Wrong password</div>
    <div style="margin-top:14px;font-size:11px;color:var(--ink3);">Default: <code style="color:var(--teal);">coordinator2026</code></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="header">
    <div>
      <div style="display:flex;align-items:center;gap:8px;"><img src="logo.png.PNG" style="height:28px;width:auto;object-fit:contain;" alt="INTERSECT"><div class="htit">📋 Coordinator</div></div>
      <div style="font-size:11px;color:var(--ink3);margin-top:2px;" id="meet-count-header">Loading...</div>
    </div>
    <div class="hbtns">
      <div style="display:flex;gap:3px;">
        <button class="lb on" data-l="en" onclick="setL('en')">EN</button>
        <button class="lb" data-l="ar" onclick="setL('ar')">AR</button>
        <button class="lb" data-l="es" onclick="setL('es')">ES</button>
        <button class="lb" data-l="fr" onclick="setL('fr')">FR</button>
        <button class="lb" data-l="ja" onclick="setL('ja')">JA</button>
        <button class="lb" data-l="zh" onclick="setL('zh')">ZH</button>
        <button class="lb" data-l="pt" onclick="setL('pt')">PT</button>
      </div>
      <button class="btn bbg" onclick="exportAll('txt')">📤 All · TXT</button>
      <button class="btn bbg" onclick="exportAll('md')" style="background:linear-gradient(135deg,#7c3aed,#3b82f6);">📤 All · MD</button>
      <button class="btn bbo" onclick="exportClient('txt')">📄 Client · TXT</button>
      <button class="btn bbo" onclick="exportClient('md')">📄 Client · MD</button>
      <button class="btn br" onclick="doLogout()">→ Logout</button>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR: Client List -->
    <div class="sidebar">
      <div class="sb-title">Clients & Files</div>
      <div id="cl-list-sidebar"></div>
      <button class="new-cl-btn" onclick="openNewClient()">+ New Client File</button>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <!-- No selection state -->
      <div id="no-selection" class="empty-state">
        <div class="empty-icon">📁</div>
        <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Select a client</div>
        <div style="font-size:13px;">Choose a client from the left to view and add meetings</div>
      </div>

      <!-- Client selected state -->
      <div id="client-content" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <div>
            <div style="font-family:Syne;font-size:20px;font-weight:800;" id="sel-cl-name">—</div>
            <div style="font-size:12px;color:var(--ink3);" id="sel-cl-meta">—</div>
          </div>
          <div style="display:flex;gap:7px;">
            <span id="sel-meet-count" style="font-size:12px;color:var(--teal);font-weight:700;"></span>
          </div>
        </div>

        <!-- Add Meeting Form -->
        <div class="panel">
          <div class="ph"><div class="pt">➕ Log New Meeting</div></div>
          <div class="pb">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="fg"><label class="fl">Title *</label><input class="fi2" id="mt-title" placeholder="e.g. Initial Partnership Discussion"></div>
              <div class="fg"><label class="fl">Date *</label><input class="fi2" type="date" id="mt-date"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="fg"><label class="fl">Meeting Type</label>
                <select class="fs" id="mt-type">
                  <option value="Initial">Initial Meeting</option>
                  <option value="Follow-up">Follow-up</option>
                  <option value="Negotiation">Negotiation</option>
                  <option value="Technical">Technical</option>
                  <option value="Strategy">Strategy</option>
                  <option value="Closing">Closing</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="fg"><label class="fl">Follow-up Deadline</label><input class="fi2" type="date" id="mt-fup"></div>
            </div>
            <div class="fg"><label class="fl">Attendees</label><input class="fi2" id="mt-att" placeholder="Names separated by comma"></div>
            <div class="fg"><label class="fl">Agenda</label><textarea class="fta" id="mt-agenda" placeholder="Meeting agenda..."></textarea></div>
            <div class="fg"><label class="fl">Summary</label><textarea class="fta" id="mt-sum" placeholder="What was discussed..."></textarea></div>
            <div class="fg"><label class="fl">Action Items</label><textarea class="fta" id="mt-acts" placeholder="Action items from this meeting..."></textarea></div>
            <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="mt-notes" placeholder="Additional notes, observations..."></textarea></div>
            <div class="fg">
              <label class="fl" style="display:flex;align-items:center;gap:6px;">
                🔒 Full Transcript
                <span style="font-size:9px;background:rgba(124,58,237,.1);color:#a78bfa;border:1px solid rgba(124,58,237,.2);padding:1px 6px;border-radius:8px;font-weight:700;">FOUNDERS ONLY</span>
              </label>
              <textarea class="fta" id="mt-tr" style="min-height:100px;font-family:monospace;font-size:11px;" placeholder="Paste full transcript here — used for AI training..."></textarea>
            </div>
            <button class="btn bbg" style="width:100%;" onclick="saveMeeting()">💾 Save Meeting</button>
          </div>
        </div>

        <!-- Meetings List -->
        <div class="panel">
          <div class="ph">
            <div class="pt">📅 Meeting History</div>
            <input id="mt-search" style="background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--ink);font-family:inherit;font-size:11px;width:150px;" placeholder="Search..." oninput="filterMeetings(this.value)">
          </div>
          <div class="pb" id="meets-list"><div class="empty-state"><div class="empty-icon">📭</div><div>No meetings yet</div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NEW CLIENT MODAL -->
<div class="mo" id="m-new-cl">
  <div class="modal">
    <div class="mti">📁 New Client File</div>
    <div class="fg"><label class="fl">Client Name *</label><input class="fi2" id="nc-name" placeholder="Company name"></div>
    <div class="fg"><label class="fl">Industry</label><input class="fi2" id="nc-ind" placeholder="e.g. Technology"></div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="nc-notes" placeholder="Initial notes about this client..."></textarea></div>
    <div class="mft">
      <button class="btn bbo" onclick="closeModal('m-new-cl')" style="padding:8px 14px;">Cancel</button>
      <button class="btn bbg" onclick="createClientFile()" style="padding:8px 20px;">📁 Create File</button>
    </div>
  </div>
</div>

var curL='en';
function tt(k){return (TT[curL]&&TT[curL][k])||TT.en[k]||k;}

function setL(l){
  curL=l;
  var isRTL=l==='ar';
  document.getElementById('trh').setAttribute('lang',l);
  document.getElementById('trh').setAttribute('dir',isRTL?'rtl':'ltr');
  document.querySelectorAll('.lb').forEach(function(b){b.classList.remove('on');});
  var a=document.querySelector('.lb[data-l="'+l+'"]');if(a)a.classList.add('on');
  try{localStorage.setItem('ix_coord_lang',l);}catch(e){}
  applyCoordTranslations();
}

function applyCoordTranslations(){
  try{
    // Login screen
    var passField=document.getElementById('coord-pass');if(passField)passField.placeholder=tt('password_placeholder');
    var accessBtn=document.querySelector('.lbtn');if(accessBtn)accessBtn.textContent=tt('access_btn');
    // Header (only after login)
    var htit=document.querySelector('.htit');if(htit)htit.textContent='📋 '+tt('title');
    // Logout btn
    document.querySelectorAll('.br').forEach(function(b){if(b.textContent.includes('Logout')||b.textContent.includes('خروج')||b.textContent.includes('Salir'))b.textContent=tt('logout');});
    // Sidebar
    var sbTitle=document.querySelector('.sb-title');if(sbTitle)sbTitle.textContent=tt('clients_label');
    var newClBtn=document.querySelector('.new-cl-btn');if(newClBtn)newClBtn.textContent=tt('new_client');
    // No selection
    var nst=document.querySelector('#no-selection div:nth-child(2)');if(nst)nst.textContent=tt('no_selection_title');
    var nss=document.querySelector('#no-selection div:nth-child(3)');if(nss)nss.textContent=tt('no_selection_sub');
    // Log meeting panel
    var logBtn=document.querySelector('#client-content .btn.bbg');if(logBtn)logBtn.textContent=tt('mt_save');
    // Search
    var srch=document.getElementById('mt-search');if(srch)srch.placeholder=tt('mt_search');
    // Form labels
    var labels=document.querySelectorAll('#client-content .fl');
    var labelKeys=['mt_title','mt_date','mt_type','mt_fup','mt_att','mt_agenda','mt_sum','mt_acts','mt_notes','mt_transcript'];
    labels.forEach(function(lb,i2){if(labelKeys[i2])lb.textContent=tt(labelKeys[i2]);});
    // Modal
    var mti=document.querySelector('#m-new-cl .mti');if(mti)mti.textContent=tt('new_cl_title');
    // Meeting history title
    var meetsList=document.getElementById('meets-list');
    if(meetsList&&meetsList.closest){
      var panel=meetsList.closest('.panel');
      if(panel){var pt=panel.querySelector('.pt');if(pt)pt.textContent=tt('mt_history');}
    }
  }catch(e){console.log('Translation error:',e);}
}

var meetings=[], clients=[], selectedClient=null, allMeetings=[];

function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast show '+(t||'ts');setTimeout(function(){el.classList.remove('show');},3000);}
function openModal(id){document.getElementById(id).style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}

function doLogin(){
  var pass=document.getElementById('coord-pass').value;
  var stored=localStorage.getItem('ix_coord_pass')||'coordinator2026';
  if(pass===stored){
    document.getElementById('login-sc').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('mt-date').value=new Date().toISOString().split('T')[0];
    try{var sl=localStorage.getItem('ix_coord_lang');if(sl)setL(sl);}catch(e){}
    loadData();
  } else {
    document.getElementById('lerr').style.display='block';
    setTimeout(function(){document.getElementById('lerr').style.display='none';},2000);
  }
}
function doLogout(){document.getElementById('main').style.display='none';document.getElementById('login-sc').style.display='flex';document.getElementById('coord-pass').value='';}

async function fetchSB(table,params){
  try{var r=await fetch(SB_URL+'/rest/v1/'+table+'?'+params,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});return await r.json();}catch(e){return [];}
}
async async function postSB(table,body){
  try{var r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});return await r.json();}catch(e){console.error('postSB error:',e);return null;}
}
async function delSB(table,id){
  try{await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});}catch(e){}
}

async function loadData(){
  // Load clients from ix_clients_v2 + ix_meetings
  var r1=await fetchSB('ix_clients_v2','order=name.asc&select=id,name,stage,industry,code');
  clients=Array.isArray(r1)?r1:[];
  var r2=await fetchSB('ix_meetings','order=date.desc');
  allMeetings=Array.isArray(r2)?r2:[];
  document.getElementById('meet-count-header').textContent=allMeetings.length+' total meetings · '+clients.length+' clients';
  renderSidebar();
}

function renderSidebar(){
  var el=document.getElementById('cl-list-sidebar');
  if(!clients.length){el.innerHTML='<div style="font-size:12px;color:var(--ink3);padding:8px;">No clients yet</div>';return;}
  el.innerHTML=clients.map(function(c){
    var cnt=allMeetings.filter(function(m){return m.organization===c.name;}).length;
    var isOn=selectedClient&&selectedClient.id===c.id;
    return '<div class="cl-item '+(isOn?'on':'')+'" data-id="'+c.id+'" onclick="selectClient(\''+c.id+'\')">'
      +'<div class="cl-name">'+c.name+'</div>'
      +'<div class="cl-meta">'+(c.industry||c.stage||'—')+'</div>'
      +(cnt?'<div class="cl-badge">'+cnt+' meetings</div>':'')
    +'</div>';
  }).join('');
}

function selectClient(id){
  selectedClient=clients.find(function(c){return c.id===id;});
  if(!selectedClient)return;
  document.querySelectorAll('.cl-item').forEach(function(el){el.classList.remove('on');});
  document.querySelector('[data-id="'+id+'"]')&&document.querySelector('[data-id="'+id+'"]').classList.add('on');
  document.getElementById('no-selection').style.display='none';
  document.getElementById('client-content').style.display='block';
  document.getElementById('sel-cl-name').textContent=selectedClient.name;
  document.getElementById('sel-cl-meta').textContent=(selectedClient.industry||'—')+' · '+selectedClient.stage;
  renderMeetings();
}

function renderMeetings(search){
  var el=document.getElementById('meets-list');
  var mts=allMeetings.filter(function(m){return m.organization===selectedClient.name;});
  if(search)mts=mts.filter(function(m){return (m.title+m.summary+m.attendees+m.action_items).toLowerCase().includes(search.toLowerCase());});
  document.getElementById('sel-meet-count').textContent=mts.length+' meetings';
  if(!mts.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div>No meetings yet for this client</div></div>';return;}
  el.innerHTML=mts.map(function(m){
    return '<div class="meet-card">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;">'
        +'<div>'
          +'<div style="font-size:13px;font-weight:700;">'+m.title+'</div>'
          +'<div style="font-size:11px;color:var(--ink3);margin-top:2px;">'+(m.date||'—')+(m.meeting_type?' · '+m.meeting_type:'')+'</div>'
        +'</div>'
        +(m.transcript?'<span style="font-size:10px;background:rgba(124,58,237,.1);color:#a78bfa;border:1px solid rgba(124,58,237,.2);padding:2px 7px;border-radius:8px;font-weight:700;flex-shrink:0;">🔒 Transcript</span>':'')
      +'</div>'
      +(m.attendees?'<div style="font-size:11px;color:var(--ink3);margin-bottom:5px;">👥 '+m.attendees+'</div>':'')
      +(m.summary?'<div style="font-size:12px;color:var(--ink2);margin-bottom:7px;line-height:1.5;">'+m.summary.slice(0,150)+(m.summary.length>150?'...':'')+'</div>':'')
      +(m.action_items?'<div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:7px;padding:8px;margin-bottom:7px;font-size:11px;color:var(--gold);">→ '+m.action_items.slice(0,120)+'</div>':'')
      +(m.notes?'<div style="font-size:11px;color:var(--ink3);margin-bottom:7px;">📝 '+m.notes.slice(0,100)+'</div>':'')
      +'<div style="display:flex;gap:6px;">'
        +(m.transcript?'<button onclick="viewTranscript(\''+m.id+'\')" style="font-size:11px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);color:#a78bfa;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;">🔒 Transcript</button>':'')
        +'<button data-mid="'+m.id+'" onclick="deleteMeeting(this.dataset.mid)" style="font-size:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-left:auto;">✕ Delete</button>'
      +'</div>'
    +'</div>';
  }).join('');
}

function filterMeetings(q){renderMeetings(q);}

async function saveMeeting(){
  if(!selectedClient){toast('Select a client first','te');return;}
  var title=document.getElementById('mt-title').value.trim();
  var date=document.getElementById('mt-date').value;
  if(!title||!date){toast('Fill title and date','te');return;}
  var body={
    title:title, organization:selectedClient.name,
    date:date, meeting_type:document.getElementById('mt-type').value,
    followup_deadline:document.getElementById('mt-fup').value||null,
    attendees:document.getElementById('mt-att').value.trim()||null,
    agenda:document.getElementById('mt-agenda').value.trim()||null,
    summary:document.getElementById('mt-sum').value.trim()||null,
    action_items:document.getElementById('mt-acts').value.trim()||null,
    notes:document.getElementById('mt-notes').value.trim()||null,
    transcript:document.getElementById('mt-tr').value.trim()||null
  };
  var r=await postSB('ix_meetings',body);
  if(r&&r[0]){
    allMeetings.unshift(r[0]);
    ['mt-title','mt-fup','mt-att','mt-agenda','mt-sum','mt-acts','mt-notes','mt-tr'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('mt-date').value=new Date().toISOString().split('T')[0];
    renderMeetings();renderSidebar();
    document.getElementById('meet-count-header').textContent=allMeetings.length+' total meetings · '+clients.length+' clients';
    toast('✅ Meeting saved!','ts');
  } else {toast('Error saving','te');}
}

async function deleteMeeting(id){
  if(!confirm('Delete this meeting?'))return;
  await delSB('ix_meetings',id);
  allMeetings=allMeetings.filter(function(m){return m.id!==id;});
  renderMeetings();renderSidebar();
  toast('Deleted','ts');
}

function viewTranscript(id){
  var m=allMeetings.find(function(x){return x.id===id;});
  if(!m||!m.transcript)return;
  var w=window.open('','_blank');
  w.document.write('<html><head><title>Transcript</title><style>body{font-family:monospace;background:#030407;color:#e8ecf8;padding:30px;line-height:1.8;white-space:pre-wrap;font-size:13px;}h1{font-family:sans-serif;font-size:16px;margin-bottom:4px;}p{color:#4a5270;font-family:sans-serif;font-size:11px;margin-bottom:20px;}</style></head><body>');
  w.document.write('<h1>'+m.title+'</h1><p>'+( m.organization||'')+' · '+(m.date||'')+' · 🔒 CONFIDENTIAL</p>');
  w.document.write(m.transcript);
  w.document.write('</body></html>');
  w.document.close();
}

// New client file
function openNewClient(){
  // Check if exists in current list first
  var r=prompt('Enter client name:');
  if(!r)return;
  // Check if already exists
  var existing=clients.find(function(c){return c.name.toLowerCase()===r.toLowerCase();});
  if(existing){selectClient(existing.id);toast('Client already exists — selected','ts');return;}
  // Create new client file (just a local entry to log meetings)
  clients.push({id:'local-'+Date.now(),name:r,stage:'—',industry:'—'});
  renderSidebar();
  selectClient(clients[clients.length-1].id);
  toast('✅ Client file created','ts');
}

// EXPORT FUNCTIONS
function buildAllTXT(){
  var txt='INTERSECT PartnerOS — Complete Meeting Archive\n';
  txt+='Generated: '+new Date().toLocaleString()+'\n';
  txt+='Total Meetings: '+allMeetings.length+'\n';
  txt+='='+(new Array(60).join('='))+'\n\n';
  var byClient={};
  allMeetings.forEach(function(m){var k=m.organization||'Unknown';if(!byClient[k])byClient[k]=[];byClient[k].push(m);});
  Object.keys(byClient).sort().forEach(function(cname){
    txt+='CLIENT: '+cname+'\n'+'-'+(new Array(50).join('-'))+'\n';
    byClient[cname].forEach(function(m){
      txt+='\nMeeting: '+m.title+'\nDate: '+(m.date||'—')+(m.meeting_type?' | Type: '+m.meeting_type:'')+'\n';
      if(m.attendees)txt+='Attendees: '+m.attendees+'\n';
      if(m.agenda)txt+='Agenda:\n'+m.agenda+'\n';
      if(m.summary)txt+='Summary:\n'+m.summary+'\n';
      if(m.action_items)txt+='Action Items:\n'+m.action_items+'\n';
      if(m.notes)txt+='Notes:\n'+m.notes+'\n';
      if(m.transcript)txt+='[TRANSCRIPT]\n'+m.transcript+'\n[END TRANSCRIPT]\n';
      txt+='\n';
    });
    txt+='\n';
  });
  return txt;
}

function buildAllMD(){
  var md='# INTERSECT PartnerOS — Meeting Archive\n\n';
  md+='> Generated: '+new Date().toLocaleString()+'  \n';
  md+='> Total Meetings: '+allMeetings.length+'\n\n---\n\n';
  var byClient={};
  allMeetings.forEach(function(m){var k=m.organization||'Unknown';if(!byClient[k])byClient[k]=[];byClient[k].push(m);});
  Object.keys(byClient).sort().forEach(function(cname){
    md+='## 🏢 '+cname+'\n\n';
    byClient[cname].forEach(function(m,i){
      md+='### '+(i+1)+'. '+m.title+'\n\n';
      md+='| Field | Value |\n|-------|-------|\n';
      md+='| Date | '+(m.date||'—')+' |\n';
      md+='| Type | '+(m.meeting_type||'—')+' |\n';
      if(m.attendees)md+='| Attendees | '+m.attendees+' |\n';
      if(m.followup_deadline)md+='| Follow-up | '+m.followup_deadline+' |\n';
      md+='\n';
      if(m.agenda)md+='**Agenda:**\n'+m.agenda+'\n\n';
      if(m.summary)md+='**Summary:**\n'+m.summary+'\n\n';
      if(m.action_items)md+='**Action Items:**\n'+m.action_items+'\n\n';
      if(m.notes)md+='**Notes:**\n'+m.notes+'\n\n';
      if(m.transcript)md+='<details>\n<summary>🔒 Full Transcript</summary>\n\n```\n'+m.transcript+'\n```\n</details>\n\n';
      md+='---\n\n';
    });
  });
  return md;
}

function exportAll(fmt){
  if(!allMeetings.length){toast('No meetings to export','te');return;}
  if(fmt==='md'){
    download(buildAllMD(),'intersect-all-meetings-'+new Date().toISOString().split('T')[0]+'.md');
  } else {
    download(buildAllTXT(),'intersect-all-meetings-'+new Date().toISOString().split('T')[0]+'.txt');
  }
  toast('✅ Exported all meetings!','ts');
}

function download(text,filename){
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
}
